name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
  pull_request:
    branches:
      - android-port
      - develop

concurrency:
  group: mafiaunity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build MafiaUnity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: MafiaUnity-2019.3.9f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            MafiaUnity-2019.3.9f1-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.3.9f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: MafiaUnity-Android
          versioning: None
          androidSymbolType: debugging
          allowDirtyBuild: false

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          test -n "${apk}" || { echo "::error::Unity finished without producing an APK"; find build -maxdepth 4 -type f -print 2>/dev/null || true; exit 1; }
          echo "APK: ${apk}"
          ls -lh "${apk}"

      - name: Upload APK and build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MafiaUnity-Android
          path: |
            build/**
            **/Editor.log
            **/*.log
          if-no-files-found: warn
          retention-days: 7
