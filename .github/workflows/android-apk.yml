name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

jobs:
  build-android:
    name: Build MafiaUnity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: MafiaUnity-2019.3.9f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            MafiaUnity-2019.3.9f1-Android-

      - name: Build unsigned/debug Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.3.9f1
          targetPlatform: Android
          androidExportType: androidPackage
          androidSymbolType: debugging
          allowDirtyBuild: false

      - name: Upload APK and symbols
        uses: actions/upload-artifact@v4
        with:
          name: MafiaUnity-Android
          path: |
            build/**/*.apk
            build/**/*.symbols.zip
          if-no-files-found: error
